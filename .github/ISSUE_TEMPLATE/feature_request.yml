name: Feature request
description: Suggest a new upgrade type, provider or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Upshift should do. A command or output example helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything you've tried or considered instead.
